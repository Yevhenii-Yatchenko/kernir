services:
  ros-gazebo:
    build:
      context: .
      dockerfile: Dockerfiles/Dockerfile.gazebo
    image: ros-gazebo
    container_name: ros_gazebo
    stdin_open: true
    tty: true
    network_mode: host
    privileged: true
    runtime: nvidia
    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      - ROS_MASTER_URI=http://localhost:11311
      # NVIDIA
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
      # Force NVIDIA on hybrid graphics (AMD + NVIDIA laptop)
      - __NV_PRIME_RENDER_OFFLOAD=1
      - __GLX_VENDOR_LIBRARY_NAME=nvidia
      - __VK_LAYER_NV_optimus=NVIDIA_only
    volumes:
      # Share X11 socket for GUI (Gazebo, RViz)
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      # Custom Gazebo models and worlds
      - ./docker_data/ros_gazebo/models:/root/gazebo_models:ro
      - ./docker_data/ros_gazebo/worlds:/root/gazebo_worlds:ro
      # Persist bash history
      - ./docker_data/ros_gazebo/.bash_history:/root/.bash_history
      # Persist Gazebo cache (faster startup after first run)
      - ./docker_data/ros_gazebo/.gazebo:/root/.gazebo
      # Custom entrypoint
      - ./docker_data/ros_gazebo/entrypoint-gazebo.sh:/entrypoint.sh:ro
    # GPU access
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    entrypoint: ["/entrypoint.sh"]
    command: ["gazebo"]

  ardupilot:
    build:
      context: .
      dockerfile: Dockerfiles/Dockerfile.ardupilot
    image: ardupilot-sitl
    container_name: ardupilot_sitl
    stdin_open: true
    tty: true
    network_mode: host
    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      # ArduPilot settings
      - ARDUPILOT_VEHICLE=Rover
      - ARDUPILOT_FRAME=gazebo-rover
      - ARDUPILOT_HEADLESS=${ARDUPILOT_HEADLESS:-0}
      - ARDUPILOT_PARAMS=${ARDUPILOT_PARAMS:-/params/arcade_4wd.parm}
    volumes:
      # Share X11 socket for GUI (MAVProxy map, console)
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      # Custom entrypoint (mounted like ros_gazebo)
      - ./docker_data/ardupilot_sitl/entrypoint-ardupilot.sh:/entrypoint.sh:ro
      # Persist bash history
      - ./docker_data/ardupilot_sitl/.bash_history:/root/.bash_history
      # ArduPilot parameter files
      - ./docker_data/ardupilot_sitl/params:/params:ro
      # Persist SITL state (eeprom, logs)
      - ./docker_data/ardupilot_sitl/sitl_data:/ardupilot/Rover/sitl_data
    entrypoint: ["/entrypoint.sh"]
    depends_on:
      - ros-gazebo

  fast-livo:
    build:
      context: .
      dockerfile: Dockerfiles/Dockerfile.fastlivo
    image: fast-livo2
    container_name: fast_livo
    stdin_open: true
    tty: true
    network_mode: host
    runtime: nvidia
    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      - ROS_MASTER_URI=http://localhost:11311
      - OMP_NUM_THREADS=8                    # FAST-LIVO2 defaults to 4, more helps ICP parallelism
      # NVIDIA
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
      # Force NVIDIA on hybrid graphics (AMD + NVIDIA laptop)
      - __NV_PRIME_RENDER_OFFLOAD=1
      - __GLX_VENDOR_LIBRARY_NAME=nvidia
      - __VK_LAYER_NV_optimus=NVIDIA_only
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      # Share X11 socket for GUI (RViz)
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      # Entrypoint script
      - ./docker_data/fast-livo/entrypoint.sh:/entrypoint.sh:ro
      # Cache repos (cloned on first run, persisted across rebuilds)
      - ./docker_data/fast-livo/repos:/cache/repos
      # Custom configs (optional overrides)
      - ./docker_data/fast-livo/config:/config:ro
      # Persist bash history
      - ./docker_data/fast-livo/.bash_history:/root/.bash_history
    entrypoint: ["/entrypoint.sh"]
    command: ["roslaunch", "fast_livo", "mapping_gazebo_vlp16.launch"]
    depends_on:
      - ros-gazebo
