services:
  ros-gazebo:
    build:
      context: .
      dockerfile: Dockerfile.gazebo
    image: ros-gazebo
    container_name: ros_gazebo
    stdin_open: true
    tty: true
    network_mode: host
    privileged: true
    runtime: nvidia
    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      - ROS_MASTER_URI=http://localhost:11311
      # NVIDIA
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
      # Force NVIDIA on hybrid graphics (AMD + NVIDIA laptop)
      - __NV_PRIME_RENDER_OFFLOAD=1
      - __GLX_VENDOR_LIBRARY_NAME=nvidia
      - __VK_LAYER_NV_optimus=NVIDIA_only
    volumes:
      # Share X11 socket for GUI (Gazebo, RViz)
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      # Custom Gazebo models and worlds
      - ./docker_data/ros_gazebo/models:/root/gazebo_models:ro
      - ./docker_data/ros_gazebo/worlds:/root/gazebo_worlds:ro
      # Persist bash history
      - ./docker_data/ros_gazebo/.bash_history:/root/.bash_history
      # Persist Gazebo cache (faster startup after first run)
      - ./docker_data/ros_gazebo/.gazebo:/root/.gazebo
      # Custom entrypoint
      - ./docker_data/ros_gazebo/entrypoint-gazebo.sh:/entrypoint.sh:ro
    # GPU access
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    entrypoint: ["/entrypoint.sh"]
    command: ["gazebo"]

  ardupilot:
    build:
      context: .
      dockerfile: Dockerfile.ardupilot
    image: ardupilot-sitl
    container_name: ardupilot_sitl
    stdin_open: true
    tty: true
    network_mode: host
    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      # ArduPilot settings
      - ARDUPILOT_VEHICLE=Rover
      - ARDUPILOT_FRAME=gazebo-rover
      - ARDUPILOT_HEADLESS=${ARDUPILOT_HEADLESS:-0}
    volumes:
      # Share X11 socket for GUI (MAVProxy map, console)
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      # Custom entrypoint (mounted like ros_gazebo)
      - ./docker_data/ardupilot_sitl/entrypoint-ardupilot.sh:/entrypoint.sh:ro
      # Persist bash history
      - ./docker_data/ardupilot_sitl/.bash_history:/root/.bash_history
    entrypoint: ["/entrypoint.sh"]
    depends_on:
      - ros-gazebo
