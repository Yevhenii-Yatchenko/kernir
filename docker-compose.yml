services:
  ros-gazebo:
    build:
      context: .
      dockerfile: Dockerfile.gazebo
    image: ros-gazebo
    container_name: ros_gazebo
    stdin_open: true
    tty: true
    network_mode: host
    privileged: true
    runtime: nvidia
    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      - ROS_MASTER_URI=http://localhost:11311
      # NVIDIA
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
      # Force NVIDIA on hybrid graphics (AMD + NVIDIA laptop)
      - __NV_PRIME_RENDER_OFFLOAD=1
      - __GLX_VENDOR_LIBRARY_NAME=nvidia
      - __VK_LAYER_NV_optimus=NVIDIA_only
    volumes:
      # Share X11 socket for GUI (Gazebo, RViz)
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      # Mount Gazebo simulation files
      - ./docker_data/ros_gazebo/ardupilot_gazebo:/root/catkin_ws/src/ardupilot_gazebo
      - ./docker_data/ros_gazebo/PX4-SITL_gazebo-classic:/root/catkin_ws/src/PX4-SITL_gazebo-classic
      - ./docker_data/ros_gazebo/velodyne_simulator:/root/catkin_ws/src/velodyne_simulator
      # Persist bash history
      - ./docker_data/ros_gazebo/.bash_history:/root/.bash_history
      # Persist Gazebo cache (faster startup after first run)
      - ./docker_data/ros_gazebo/.gazebo:/root/.gazebo
      # Custom entrypoint
      - ./docker_data/ros_gazebo/entrypoint-gazebo.sh:/entrypoint.sh:ro
    # GPU access
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    entrypoint: ["/entrypoint.sh"]
    command: ["gazebo"]

