common:
  img_topic: "/camera/image_raw"
  lid_topic: "/velodyne_points"
  imu_topic: "/imu/data"
  img_en: 0
  lidar_en: 1
  ros_driver_bug_fix: false

extrin_calib:
  # LiDAR and IMU co-located, both aligned with model frame (no rotation)
  extrinsic_T: [0.0, 0.0, 0.0]
  extrinsic_R: [1, 0, 0, 0, 1, 0, 0, 0, 1]
  # LiDAR→Camera: transforms points FROM LiDAR frame TO camera optical frame
  # Camera at (-0.32,0,0.12) facing -X (180° yaw), LiDAR at (0,0,0.1877)
  # Optical X(right)=model+Y, Optical Y(down)=-modelZ, Optical Z(fwd)=-modelX
  Rcl: [ 0, 1, 0,
         0, 0,-1,
        -1, 0, 0]
  Pcl: [0.0, -0.0677, -0.32]

time_offset:
  lidar_time_offset: 0.0
  imu_time_offset: 0.0
  img_time_offset: 0.0
  exposure_time_init: 0.0

preprocess:
  point_filter_num: 1
  filter_size_surf: 0.1
  lidar_type: 3
  scan_line: 64
  blind: 0.5

vio:
  max_iterations: 5
  outlier_threshold: 1000
  img_point_cov: 25                      # default 100 too low-trust; 10 may over-weight noisy features
  patch_size: 8
  patch_pyrimid_level: 3
  normal_en: true
  raycast_en: false
  inverse_composition_en: false
  exposure_estimate_en: true
  inv_expo_cov: 0.1

imu:
  imu_en: true
  imu_int_frame: 30
  acc_cov: 0.001
  gyr_cov: 0.001
  b_acc_cov: 0.00001
  b_gyr_cov: 0.00001

lio:
  max_iterations: 5                      # default (8 was overkill)
  dept_err: 0.02
  beam_err: 0.03
  min_eigen_value: 0.0025               # default — 0.001 accepted too-thin planes
  voxel_size: 0.25
  max_layer: 2                           # default
  max_points_num: 50
  layer_init_num: [5, 5, 5, 5, 5]

local_map:
  map_sliding_en: false                   # limit map to a window around robot — prevents unbounded RAM growth
  half_map_size: 50                      # 50m half-size = 100m×100m sliding window
  sliding_thresh: 8

uav:
  imu_rate_odom: false
  gravity_align_en: true

publish:
  dense_map_en: true
  pub_effect_point_en: false
  pub_plane_en: false
  pub_scan_num: 1
  blind_rgb_points: 0.0

evo:
  seq_name: "gazebo_sim"
  pose_output_en: true

pcd_save:
  pcd_save_en: false
  type: 0
  colmap_output_en: false
  filter_size_pcd: 0.15
  interval: -1

image_save:
  img_save_en: false
  interval: 1
