# =============================================================================
# FAST-LIVO2 — повна конфігурація для Gazebo VLP-16
# =============================================================================
# Режими роботи (визначається автоматично):
#   img_en=1, lidar_en=1         → LIVO  (LiDAR + IMU + Камера)
#   img_en=0, lidar_en=1, imu=1  → ONLY_LIO (LiDAR + IMU)
#   img_en=0, lidar_en=1, imu=0  → ONLY_LO  (тільки LiDAR)
# =============================================================================

common:
  lid_topic: "/velodyne_points"      # ROS топік LiDAR (sensor_msgs/PointCloud2)
  imu_topic: "/imu/data"             # ROS топік IMU (sensor_msgs/Imu)
  img_topic: "/camera/image_raw"     # ROS топік камери (sensor_msgs/Image)
  img_en: 0                          # 1 = увімкнути камеру (LIVO режим), 0 = без камери (ONLY_LIO)
  lidar_en: 1                        # 1 = увімкнути LiDAR (завжди має бути 1)
  ros_driver_bug_fix: false           # Виправлення бага часових міток у деяких Livox драйверах. Для Gazebo — false

# =============================================================================
# Калібровка екстринсиків (перетворення між сенсорами)
# =============================================================================
extrin_calib:
  # Трансляція LiDAR → IMU [x, y, z] в метрах
  # Позиція LiDAR відносно IMU. В нашій моделі: LiDAR z=0.1877, IMU z=0.1
  extrinsic_T: [0.0, 0.0, 0.0877]
  # Матриця повороту LiDAR → IMU (3x3, row-major)
  # Ідентична, бо обидва сенсори орієнтовані однаково
  extrinsic_R: [1, 0, 0,
                0, 1, 0,
                0, 0, 1]
  # Матриця повороту камери → LiDAR (3x3, row-major)
  # Ідентична — камера і LiDAR дивляться в одному напрямку в Gazebo
  Rcl: [1, 0, 0,
        0, 1, 0,
        0, 0, 1]
  # Трансляція камери → LiDAR [x, y, z] в метрах
  # Камера (0.32, 0, 0.12) відносно LiDAR (0, 0, 0.1877) = (0.32, 0, -0.0677)
  Pcl: [0.32, 0.0, -0.0677]

# =============================================================================
# Зміщення часових міток між сенсорами (секунди)
# =============================================================================
time_offset:
  lidar_time_offset: 0.0              # Зміщення часу LiDAR відносно системного годинника
  imu_time_offset: 0.0                # Зміщення часу IMU
  img_time_offset: 0.0                # Зміщення часу камери
  exposure_time_init: 0.0             # Початковий час експозиції камери (для компенсації motion blur)

# =============================================================================
# Попередня обробка LiDAR хмари точок
# =============================================================================
preprocess:
  lidar_type: 2                       # Тип LiDAR: 1=Livox Avia, 2=Velodyne/Ouster, 3=Livox Mid-360
  scan_line: 16                       # Кількість скан-ліній (VLP-16 = 16)
  blind: 0.5                          # Мінімальна відстань точок (м). Точки ближче — відкидаються
  point_filter_num: 3                 # Проріджування: залишити кожну N-ту точку з кожної лінії
  filter_size_surf: 0.1               # Розмір voxel-фільтра (м) для даунсемплінгу хмари
  feature_extract_enabled: false      # [ВІДСУТНІЙ В КОНФІГУ] Витягувати ребра/площини з хмари. false = використовувати raw точки
  hilti_en: false                     # [ВІДСУТНІЙ В КОНФІГУ] Спец. режим для Hilti SLAM Challenge датасету

# =============================================================================
# VIO — Visual-Inertial Odometry (працює тільки в LIVO режимі, img_en=1)
# =============================================================================
vio:
  max_iterations: 5                   # Макс. ітерацій оптимізації VIO EKF на кадр
  outlier_threshold: 1000             # Поріг відкидання вікізуальних outlier-ів (більше = м'якше)
  img_point_cov: 100                  # Коваріація похибки візуальних точок у EKF (більше = менше довіри камері)
  patch_size: 8                       # Розмір патчу (пікселі) для порівняння візуальних фіч
  patch_pyrimid_level: 3              # Кількість рівнів піраміди для мульти-масштабного matching
  normal_en: true                     # Використовувати нормалі поверхонь для кращого візуального matching
  raycast_en: false                   # Raycast для перевірки видимості точок (повільно, але точніше)
  inverse_composition_en: false       # Метод інверсної композиції для оптимізації (альтернативний алгоритм)
  exposure_estimate_en: true          # Оцінювати час експозиції камери для компенсації яскравості
  inv_expo_cov: 0.1                   # Коваріація оцінки інверсної експозиції (менше = жорсткіший prior)
  grid_size: 5                        # [ВІДСУТНІЙ В КОНФІГУ] Розмір сітки для розподілу фіч по зображенню
  grid_n_height: 17                   # [ВІДСУТНІЙ В КОНФІГУ] Кількість клітинок сітки по висоті

# =============================================================================
# IMU — налаштування інерціального сенсора
# =============================================================================
imu:
  imu_en: true                        # Увімкнути IMU (вимкнення = ONLY_LO режим)
  imu_int_frame: 30                   # Кількість IMU вимірювань між LiDAR кадрами для інтегрування
  acc_cov: 0.5                        # Шум акселерометра (ковар.). Більше = менше довіри акселерометру
  gyr_cov: 0.3                        # Шум гіроскопа (ковар.). Більше = менше довіри гіроскопу
  b_acc_cov: 0.0001                   # Random walk bias акселерометра. Як швидко дрейфує зміщення
  b_gyr_cov: 0.0001                   # Random walk bias гіроскопа
  gravity_est_en: true                # [ВІДСУТНІЙ В КОНФІГУ] Оцінювати вектор гравітації в EKF
  ba_bg_est_en: true                  # [ВІДСУТНІЙ В КОНФІГУ] Оцінювати bias акселерометра/гіроскопа в EKF

# =============================================================================
# LIO — LiDAR-Inertial Odometry (вокселна карта)
# =============================================================================
lio:
  max_iterations: 5                   # Макс. ітерацій ICP/EKF за один LiDAR скан
  voxel_size: 0.5                     # Розмір вокселя (м). Менше = деталізованіша карта, більше RAM
  max_layer: 2                        # Макс. глибина октодерева у вокселі (0-4). Більше = точніші площини
  max_points_num: 50                  # Макс. точок у вокселі перед поділом на піддерево
  layer_init_num: [5, 5, 5, 5, 5]    # Мін. точок для ініціалізації площини на кожному рівні октодерева
  min_eigen_value: 0.0025             # Мін. eigenvalue для визнання площини (менше = приймати тонші площини)
  dept_err: 0.02                      # Похибка LiDAR по глибині (м)
  beam_err: 0.01                      # Похибка кута LiDAR променя (рад)
  sigma_num: 3                        # [ВІДСУТНІЙ В КОНФІГУ] Кількість сігм для порогу Махаланобіса в ICP

# =============================================================================
# Локальна карта — ковзне вікно для обмеження пам'яті
# =============================================================================
local_map:
  map_sliding_en: false               # Увімкнути ковзне вікно (видаляти воксели далеко від робота)
  half_map_size: 10000                # Половина розміру карти у вокселях (куб 2*N навколо робота)
  sliding_thresh: 800                 # Мін. відстань руху (м) перед зсувом вікна

# =============================================================================
# UAV — спеціальні налаштування для безпілотників
# =============================================================================
uav:
  imu_rate_odom: true                 # Публікувати одометрію на частоті IMU (~200Hz) на /LIVO2/imu_propagate
  gravity_align_en: true              # Вирівняти карту по гравітації при старті (Z завжди вгору)

# =============================================================================
# Публікація даних у ROS топіки
# =============================================================================
publish:
  dense_map_en: true                  # true = публікувати всі точки, false = тільки площинні фічі
  pub_effect_point_en: true           # Публікувати /cloud_effected (точки, що вплинули на LIO оновлення)
  pub_plane_en: false                 # Публікувати /voxels (візуалізація площин MarkerArray — повільно)
  pub_scan_num: 1                     # Публікувати кожен N-й скан (1 = кожен, 2 = кожен другий)
  blind_rgb_points: 0.0              # Мін. відстань для RGB-колорованих точок (м). 0 = без фільтрації

# =============================================================================
# Оцінка траєкторії (для benchmarking / порівняння з ground truth)
# =============================================================================
evo:
  seq_name: "gazebo_sim"              # Ім'я послідовності для збереження файлу траєкторії
  pose_output_en: true                # Зберігати траєкторію у файл (формат TUM для evo)

# =============================================================================
# Збереження PCD карти на диск
# =============================================================================
pcd_save:
  pcd_save_en: false                  # Зберегти фінальну карту у PCD файл при завершенні
  type: 0                             # Формат: 0 = binary PCD, 1 = ASCII PCD
  colmap_output_en: false             # Зберегти у форматі COLMAP (для 3D-реконструкції)
  filter_size_pcd: 0.15               # Даунсемплінг перед збереженням (м). Менше = більший файл
  interval: -1                        # Інтервал збереження (-1 = тільки в кінці, N = кожен N-й кадр)

# =============================================================================
# Збереження зображень на диск
# =============================================================================
image_save:
  img_save_en: false                  # Зберігати оброблені зображення камери
  interval: 1                         # Зберігати кожен N-й кадр (1 = кожен)

# =============================================================================
# Debug (не в основному конфігу, але підтримується)
# =============================================================================
# debug:
#   plot_time: -10                    # Час (сек від старту) для збереження debug-візуалізації VIO. -10 = вимкнено
#   frame_cnt: 6                      # Допуск кадрів навколо plot_time для захоплення
